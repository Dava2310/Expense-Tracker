name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Migrate and seed a fresh database
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test --compact

      - name: Smoke test (app boots and serves requests)
        run: |
          php artisan serve --port=8000 &
          for i in $(seq 1 15); do
            curl -sf -o /dev/null http://127.0.0.1:8000/up && break
            sleep 1
          done
          curl -sSf -o /dev/null http://127.0.0.1:8000/up
          curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/ | grep -E '^(200|302)$'
