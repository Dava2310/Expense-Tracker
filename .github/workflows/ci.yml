name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: expense_tracker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, pdo_mysql, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          if [ "${{ matrix.db }}" = "mysql" ]; then
            {
              echo "DB_CONNECTION=mysql"
              echo "DB_HOST=127.0.0.1"
              echo "DB_PORT=3306"
              echo "DB_DATABASE=expense_tracker"
              echo "DB_USERNAME=root"
              echo "DB_PASSWORD=secret"
            } >> .env
          else
            touch database/database.sqlite
          fi

      - name: Migrate and seed a fresh database
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test --compact

      - name: Smoke test (app boots and serves requests)
        run: |
          php artisan serve --port=8000 &
          for i in $(seq 1 15); do
            curl -sf -o /dev/null http://127.0.0.1:8000/up && break
            sleep 1
          done
          curl -sSf -o /dev/null http://127.0.0.1:8000/up
          curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/ | grep -E '^(200|302)$'
